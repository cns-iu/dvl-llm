<div class="stepper" *ngIf="currentStep >= 0">
  <ng-container *ngFor="let step of steps; let i = index">
    <ng-container *ngIf="i <= currentStep; else futureStep">
      <a
        class="step"
        [routerLink]="step.routerLink"
        [ngClass]="{ completed: i < currentStep, active: i === currentStep }"
      >
        <!-- grid-col 1  (spans both rows) -->
        <!-- <div class="step-number">{{ i + 1 }}</div> -->
        <div class="step-icon">
          <!-- Step 1 Icon -->
          <svg
            *ngIf="i === 0"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="24" height="24" rx="12" fill="#4B4B5E" />
            <path
              d="M11.764 17V7.928L9.86 9.144L9.172 7.976L12.084 6.008H13.38V17H11.764Z"
              fill="white"
            />
          </svg>

          <!-- Step 2 Icon -->
          <svg
            *ngIf="i === 1"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="24" height="24" rx="12" fill="currentColor" />
            <path
              d="M7.8 17V15.672L11.832 12.344C13.304 11.112 13.864 10.168 13.864 9.176C13.864 7.976 12.872 7.272 11.784 7.272C10.584 7.272 9.704 7.912 8.936 8.904L7.848 7.944C8.808 6.616 10.104 5.816 11.848 5.816C13.896 5.816 15.528 7.144 15.528 9.144C15.528 10.616 14.824 11.784 12.936 13.32L10.36 15.496H15.624V17H7.8Z"
              fill="white"
            />
          </svg>

          <!-- Step 3 Icon -->
          <svg
            *ngIf="i === 2"
            width="24"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect y="0.5" width="24" height="24" rx="12" fill="currentColor" />
            <path
              d="M11.832 17.692C9.96 17.692 8.536 16.876 7.688 15.82L8.728 14.748C9.464 15.644 10.536 16.236 11.8 16.236C13.224 16.236 14.136 15.484 14.136 14.38C14.136 13.244 13.176 12.652 11.544 12.668H10.344V11.228L11.544 11.244C12.936 11.244 13.912 10.636 13.912 9.532C13.912 8.508 12.952 7.772 11.672 7.772C10.52 7.772 9.672 8.348 8.904 9.244L7.896 8.252C8.744 7.148 9.992 6.316 11.784 6.316C14.008 6.316 15.544 7.548 15.544 9.308C15.544 10.668 14.6 11.516 13.448 11.868C14.584 12.124 15.784 12.956 15.784 14.492C15.784 16.348 14.216 17.692 11.832 17.692Z"
              fill="white"
            />
          </svg>
        </div>

        <!-- grid-col 2 / row-1 -->
        <div class="step-label">{{ step.label }}</div>

        <!-- grid-col 3  (spans both rows) -->
        <svg
          *ngIf="i < currentStep"
          class="step-check"
          width="16"
          height="13"
          viewBox="0 0 16 13"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5.54972 9.65L14.0247 1.175C14.2247 0.975 14.4581 0.875 14.7247 0.875C14.9914 0.875 15.2247 0.975 15.4247 1.175C15.6247 1.375 15.7247 1.6125 15.7247 1.8875C15.7247 2.1625 15.6247 2.4 15.4247 2.6L6.24972 11.8C6.04972 12 5.81639 12.1 5.54972 12.1C5.28305 12.1 5.04972 12 4.84972 11.8L0.549719 7.5C0.349719 7.3 0.253885 7.0625 0.262219 6.7875C0.270552 6.5125 0.374719 6.275 0.574719 6.075C0.774719 5.875 1.01222 5.775 1.28722 5.775C1.56222 5.775 1.79972 5.875 1.99972 6.075L5.54972 9.65Z"
            fill="#201E3D"
          />
        </svg>

        <!-- grid-col 2 / row-2  (only when done) -->
        <div
          *ngIf="stepDescriptions[i] && i < currentStep"
          class="step-subtext"
        >
          {{ stepDescriptions[i] }}
        </div>
      </a>
    </ng-container>
    <ng-template #futureStep>
      <div class="step disabled">
        <!-- same 3-column grid structure -->
        <!-- <div class="step-number">{{ i + 1 }}</div> -->
        <div class="step-icon">
          <!-- Step 1 Icon -->
          <svg
            *ngIf="i === 0"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="24" height="24" rx="12" fill="currentColor" />
            <path
              d="M11.764 17V7.928L9.86 9.144L9.172 7.976L12.084 6.008H13.38V17H11.764Z"
              fill="white"
            />
          </svg>

          <!-- Step 2 Icon -->
          <svg
            *ngIf="i === 1"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="24" height="24" rx="12" fill="currentColor" />
            <path
              d="M7.8 17V15.672L11.832 12.344C13.304 11.112 13.864 10.168 13.864 9.176C13.864 7.976 12.872 7.272 11.784 7.272C10.584 7.272 9.704 7.912 8.936 8.904L7.848 7.944C8.808 6.616 10.104 5.816 11.848 5.816C13.896 5.816 15.528 7.144 15.528 9.144C15.528 10.616 14.824 11.784 12.936 13.32L10.36 15.496H15.624V17H7.8Z"
              fill="white"
            />
          </svg>

          <!-- Step 3 Icon -->
          <svg
            *ngIf="i === 2"
            width="24"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect y="0.5" width="24" height="24" rx="12" fill="currentColor" />
            <path
              d="M11.832 17.692C9.96 17.692 8.536 16.876 7.688 15.82L8.728 14.748C9.464 15.644 10.536 16.236 11.8 16.236C13.224 16.236 14.136 15.484 14.136 14.38C14.136 13.244 13.176 12.652 11.544 12.668H10.344V11.228L11.544 11.244C12.936 11.244 13.912 10.636 13.912 9.532C13.912 8.508 12.952 7.772 11.672 7.772C10.52 7.772 9.672 8.348 8.904 9.244L7.896 8.252C8.744 7.148 9.992 6.316 11.784 6.316C14.008 6.316 15.544 7.548 15.544 9.308C15.544 10.668 14.6 11.516 13.448 11.868C14.584 12.124 15.784 12.956 15.784 14.492C15.784 16.348 14.216 17.692 11.832 17.692Z"
              fill="white"
            />
          </svg>
        </div>
        <div class="step-label">{{ step.label }}</div>
        <!-- Empty third column for grid consistency -->
        <div></div>
      </div>
    </ng-template>

    <div class="step-line" *ngIf="i < steps.length - 1"></div>
  </ng-container>
</div>
