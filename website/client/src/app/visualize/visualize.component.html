<div class="visualize-wrapper">
  <!-- 1) Intro header -->
  <div class="intro-header">
    <div class="header-text">Optimize with AI</div>
    <div class="header-description">
      Improve the visualization code by prompting with AI.
    </div>
  </div>

  <!-- 2) Story + Properties -->
  <!-- <div class="story-header">
    <div class="story-info">
      <h3>Selected Dataset : {{ storyTitle }}</h3>
      <p>{{ storyDescription }}</p>
    </div>
    <div class="info-panel">
      <h3>Properties</h3>
      <table class="info-table">
        <tr>
          <td>Model</td>
          <td>{{ selectedModel }}</td>
        </tr>
        <tr>
          <td>Language</td>
          <td>{{ selectedLanguage }}</td>
        </tr>
        <tr>
          <td>Library</td>
          <td>{{ selectedLibrary }}</td>
        </tr>
      </table>
    </div>
  </div> -->
  <div *ngIf="isGenerating" class="loading-spinner">
    Generating visualization… Please wait...
  </div>
  <!-- 5) Split-pane: Code editor on the left, visualization on the right -->
  <div class="split-pane" #splitPane>
    <!-- LEFT: ACE editor pane -->
    <div class="left-pane" #leftPane>
      <div class="pane-card">
        <!-- header with title + icons -->
        <div class="pane-header">
          <span class="pane-title">Code</span>
          <div class="pane-icons">
            <!-- Copy button -->
            <!-- <button title="Copy code" (click)="copyCode()"> -->
            <button title="Copy code" (click)="copyCode()">
              <svg
                width="17"
                height="20"
                viewBox="0 0 17 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M6 16C5.45 16 4.97917 15.8042 4.5875 15.4125C4.19583 15.0208 4 14.55 4 14V2C4 1.45 4.19583 0.979167 4.5875 0.5875C4.97917 0.195833 5.45 0 6 0H15C15.55 0 16.0208 0.195833 16.4125 0.5875C16.8042 0.979167 17 1.45 17 2V14C17 14.55 16.8042 15.0208 16.4125 15.4125C16.0208 15.8042 15.55 16 15 16H6ZM2 20C1.45 20 0.979167 19.8042 0.5875 19.4125C0.195833 19.0208 0 18.55 0 18V5C0 4.71667 0.0958333 4.47917 0.2875 4.2875C0.479167 4.09583 0.716667 4 1 4C1.28333 4 1.52083 4.09583 1.7125 4.2875C1.90417 4.47917 2 4.71667 2 5V18H12C12.2833 18 12.5208 18.0958 12.7125 18.2875C12.9042 18.4792 13 18.7167 13 19C13 19.2833 12.9042 19.5208 12.7125 19.7125C12.5208 19.9042 12.2833 20 12 20H2Z"
                  fill="#201E3D"
                />
              </svg>
            </button>
            <!-- </button> -->
            <!-- Revert button -->
            <!-- <button
              class="action-button revert-button"
              title="Revert code"
              (click)="revertCode()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 4v6h6"></path>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
            </button> -->
            <!-- Copied message -->
            <div class="copied-message" *ngIf="copiedMessageShown">Copied!</div>
          </div>
        </div>
        <!-- content area -->
        <div class="pane-content">
          <ace-editor
            [(text)]="codeText"
            [mode]="selectedLanguage.toLowerCase()"
            [theme]="'monokai'"
            style="width: 100%; height: 100%"
            [readOnly]="false"
          ></ace-editor>
        </div>
      </div>
    </div>

    <!-- unchanged drag handle -->
    <div
      class="drag-bar"
      #dragBar
      (mousedown)="startDragging($event)"
      (touchstart)="startTouchDragging($event)"
    ></div>

    <!-- RIGHT: Visualization pane -->
    <div class="right-pane" #rightPane>
      <div class="pane-card">
        <!-- header with title + download icon -->
        <div class="pane-header">
          <span class="pane-title">Visualization</span>
          <div class="pane-icons">

            <button
              title="Undo"
              (click)="undoVisualization()"

            >

        <!-- content area -->
        <div class="pane-content">
          <div class="iframe-wrapper" *ngIf="visualSrc">
            <iframe
              *ngIf="!visualSrc.toString().endsWith('.png')"
              [src]="visualSrc"
              class="visual-frame"
              frameborder="0"
              allowfullscreen
            ></iframe>
            <img
              *ngIf="visualSrc.toString().endsWith('.png')"
              [src]="visualSrc"
              class="image-frame"
              alt="Visualization PNG"
            />
          </div>
        </div>
      </div>

  <!-- // -->
  <!--  CHAT HISTORY -->
  <section class="history-list" *ngIf="history.length">
    <article *ngFor="let h of history; let last = last" class="history-item">
      <!-- user pill (right) -->
      <div class="user-pill">{{ h.userText }}</div>

      <!-- avatar + header (left) -->
      <div class="assistant-message">
        <div class="assistant-header">
          <div class="avatar"></div>
          <span class="assistant-name">{{ h.model }}</span>
          <span class="timestamp"
            >Today at {{ h.time | date : "shortTime" }}</span
          >
        </div>

        <!-- assistant body -->
        <div class="assistant-body" [ngClass]="{ waiting: !h.isDone }">
          <ng-container *ngIf="!h.isDone">
            <!-- <span class="thinking-icon">⚡</span> Thinking… -->
            <span class="thinking-icon"
              ><svg
                width="19"
                height="19"
                viewBox="0 0 19 19"
                fill="none"

                  fill="#E00D3A"
                />
              </svg>
            </span>
            <span class="thinking-text">Thinking...</span>
          </ng-container>
          <ng-container *ngIf="h.isDone">
            <pre class="code-preview" [class.collapsed]="h.collapsed"
              >{{ h.code }} </pre
            >

            <!-- <button class="toggle-btn" (click)="h.collapsed = !h.collapsed">
            {{ h.collapsed ? "Show more" : "Show less" }}
          </button> -->
            <button class="toggle-btn" (click)="h.collapsed = !h.collapsed">
              <ng-container *ngIf="h.collapsed; else expanded">
                <!-- ▼ Show more -->
                <svg
                  width="24"
                  height="25"
                  viewBox="0 0 24 25"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <mask
                    id="showMoreMask"
                    maskUnits="userSpaceOnUse"
                    x="0"
                    y="0"
                    width="24"
                    height="25"
                  >
                    <rect y="0.619446" width="24" height="24" fill="#D9D9D9" />
                  </mask>
                  <g mask="url(#showMoreMask)">
                    <path
                      d="M12 15.5944c-.134 0-.259-.022-.376-.063a.998.998 0 0 1-.325-.18L6.7 10.719a1.02 1.02 0 0 1 0-1.438 1 1 0 0 1 1.4 0L12 13.22l3.9-3.939a1 1 0 0 1 1.4 1.438l-4.6 4.6a.998.998 0 0 1-.325.18c-.117.041-.242.063-.375.063z"
                      fill="#B20A2F"
                    />
                  </g>
                </svg>
                <span>Show more</span>
              </ng-container>

              <ng-template #expanded>
                <!-- ▲ Show less -->
                <svg
                  width="24"
                  height="25"
                  viewBox="0 0 24 25"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <mask
                    id="showLessMask"
                    maskUnits="userSpaceOnUse"
                    x="0"
                    y="0"
                    width="24"
                    height="25"
                  >
                    <rect y="0.619385" width="24" height="24" fill="#D9D9D9" />
                  </mask>
                  <g mask="url(#showLessMask)">
                    <path
                      d="M12 11.4194l-3.9 3.9a1 1 0 0 1-1.4-1.437l4.6-4.6a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1-1.4 1.437l-3.9-3.9z"
                      fill="#B20A2F"
                    />
                  </g>
                </svg>
                <span>Show less</span>
              </ng-template>
            </button>
          </ng-container>
        </div>
      </div>
    </article>
  </section>
  <!-- CHAT HISTORY END -->

  <!-- // -->
  <div class="refine-box">
    <!-- ❶  multi-line input -->
    <textarea
      class="refine-input"
      [(ngModel)]="refineText"
      placeholder="Optimize visualization with AI"
    >
    </textarea>

    <!-- ❷  chips + arrow share one grid row -->
    <div class="chip-row">
      <div class="suggestions">
        <button
          *ngFor="let s of suggestions"
          class="suggestion-button"
          (click)="setRefinePrompt(s.description)"
        >
          {{ s.keyword }}
        </button>
      </div>

      <!-- submit icon -->
      <button
        [disabled]="isGenerating"
        class="submit-icon"
        (click)="applyRefinement()"
      >
        <!-- Arrow -->
        <svg
          width="12"
          height="13"
          viewBox="0 0 12 13"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5.00078 3.41984L2.10078 6.31984C1.91745 6.50317 1.68411 6.59484 1.40078 6.59484C1.11745 6.59484 0.884115 6.50317 0.700781 6.31984C0.517448 6.1365 0.425781 5.90317 0.425781 5.61984C0.425781 5.3365 0.517448 5.10317 0.700781 4.91984L5.30078 0.319836C5.50078 0.119836 5.73411 0.0198364 6.00078 0.0198364C6.26745 0.0198364 6.50078 0.119836 6.70078 0.319836L11.3008 4.91984C11.4841 5.10317 11.5758 5.3365 11.5758 5.61984C11.5758 5.90317 11.4841 6.1365 11.3008 6.31984C11.1174 6.50317 10.8841 6.59484 10.6008 6.59484C10.3174 6.59484 10.0841 6.50317 9.90078 6.31984L7.00078 3.41984V11.6198C7.00078 11.9032 6.90495 12.1407 6.71328 12.3323C6.52161 12.524 6.28411 12.6198 6.00078 12.6198C5.71745 12.6198 5.47995 12.524 5.28828 12.3323C5.09661 12.1407 5.00078 11.9032 5.00078 11.6198V3.41984Z"
            fill="#201E3D"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
