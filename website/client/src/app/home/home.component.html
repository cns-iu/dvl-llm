<div class="home-container">
  <div class="splash">
    <div class="splash-content">
      <div class="splash-title">Create data visualizations with AI</div>

      <div class="card-group">
        <div class="splash-card" *ngFor="let c of cards">
          <div class="card-header">
            <div class="card-step">{{ c.step }}</div>
            <div class="card-title">{{ c.title }}</div>
          </div>
          <div class="card-text">{{ c.text }}</div>
        </div>
      </div>

      <!-- New: API key + Get started, side-by-side -->
      <!-- API key + Get started, side-by-side -->
      <div class="cta-row">
        <div class="provider-dropdown">
          <select
            id="provider"
            [(ngModel)]="selectedProvider"
            class="provider-select"
          >
            <option value="" disabled>Select Provider</option>
            <option value="google">Google</option>
            <option value="openai">OpenAI</option>
            <option value="jetstream">Jetstream2</option>
          </select>
        </div>
        <div class="api-key-box">
          <div class="api-input-wrap">
            <input
              id="apiKey"
              [(ngModel)]="apiKey"
              [type]="showKey ? 'text' : 'password'"
              class="api-input"
              placeholder="Enter your API key here"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="toggleKeyVisibility()"
              [attr.aria-pressed]="showKey"
              [attr.aria-label]="showKey ? 'Hide API key' : 'Show API key'"
              title="{{ showKey ? 'Hide API key' : 'Show API key' }}"
            >
              <svg
                *ngIf="!showKey"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
