#version: "3.8"

services:
  frontend:
    build: ./client
    ports:
        - "4200:80"
  python-executor:
    build: ./python_executor
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./server/sdata:/app/sdata
    depends_on:
      python-executor:
        condition: service_healthy
#      r-executor:
#        condition: service_healthy
#      js-executor:
#        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
