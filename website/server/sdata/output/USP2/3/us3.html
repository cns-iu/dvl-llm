<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HRA EUI Heart Local Dataset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://cdn.humanatlas.io/ui/ccf-eui/styles.css" rel="stylesheet" />
    <script type="module" src="https://cdn.humanatlas.io/ui/ccf-eui/wc.js"></script>
    <style>
      body, html {{ margin: 0; padding: 0; height: 100%; }}
      ccf-eui {{ width: 100%; height: 100vh; display: block; }}
    </style>
  </head>
  <body>
    <ccf-eui
      base-href="https://cdn.humanatlas.io/ui/ccf-eui/"
      remote-api-endpoint="https://apps.humanatlas.io/api"
      header="false"
      filter='{{"ontologyTerms": ["http://purl.obolibrary.org/obo/UBERON_0000948"]}}'
      selected-organs=
        '[
         "http://purl.obolibrary.org/obo/UBERON_0000948"]'
    >
    </ccf-eui>
  </body>
</html>
